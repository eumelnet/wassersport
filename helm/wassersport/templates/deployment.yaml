apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wassersport.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wassersport.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "wassersport.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "wassersport.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      serviceAccountName: {{ include "wassersport.serviceAccountName.app" . }}
      automountServiceAccountToken: false

      # ── Pod-level security (Pod Security Standards: restricted) ──────────────
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        runAsGroup:   1000
        fsGroup:      1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          image: {{ include "wassersport.appImage" . | quote }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}

          # ── Container-level security ────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities:
              drop: ["ALL"]

          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP

          # ── Environment — non-sensitive from ConfigMap, secrets from Secret ─
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "wassersport.fullname" . }}-app
                  key: PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "wassersport.fullname" . }}-app
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "wassersport.fullname" . }}-app
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "wassersport.fullname" . }}-app
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "wassersport.fullname" . }}
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wassersport.fullname" . }}
                  key: jwt-secret

          # ── Volumes — /tmp must be writable for Node.js ─────────────────────
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          # ── Probes ──────────────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # 60 s total for DB connection on startup

          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}

      volumes:
        - name: tmp
          emptyDir: {}

      # Spread pods across nodes for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "wassersport.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: app
