# Dedicated ServiceAccount for the app — no token auto-mount, no RBAC rights
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wassersport.serviceAccountName.app" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wassersport.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
automountServiceAccountToken: false
---
# Dedicated ServiceAccount for the database — isolated from app SA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wassersport.serviceAccountName.db" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wassersport.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
automountServiceAccountToken: false
