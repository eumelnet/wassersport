apiVersion: v1
kind: Service
metadata:
  name: {{ include "wassersport.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wassersport.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  selector:
    {{- include "wassersport.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.app.port }}
      targetPort: http
      protocol: TCP
