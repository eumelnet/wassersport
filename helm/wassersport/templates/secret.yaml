# All sensitive values in a single Secret.
# In production: replace with External Secrets Operator / Sealed Secrets / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wassersport.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wassersport.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ .Values.secrets.dbPassword | quote }}
  db-root-password: {{ .Values.secrets.dbRootPassword | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
