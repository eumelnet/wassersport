nameOverride: ""
fullnameOverride: ""

# ── Application ───────────────────────────────────────────────────────────────
app:
  image:
    repository: ghcr.io/eumelnet/eumelnet/wassersport
    tag: "login"           # defaults to .Chart.AppVersion
    pullPolicy: Always
  # Uploads persist on a RWO PVC (see `uploads` section below).
  # With RWO only one pod can mount the volume at a time — keep replicaCount: 1
  # and autoscaling.enabled: false, OR switch uploads.accessMode to ReadWriteMany.
  replicaCount: 1
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser:    1001
    runAsGroup:   1001
    fsGroup:      1001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem:   true
    capabilities:
      drop: ["ALL"]

# ── Uploads (CMS media library) ───────────────────────────────────────────────
# Backs /app/data/uploads with a PersistentVolumeClaim so images survive pod
# restarts. RWO is the safe default; if you need multi-replica HA, provision
# a RWX StorageClass (NFS/CephFS/EFS) and set accessMode: ReadWriteMany.
uploads:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteOnce
  # Leave empty to use the cluster default StorageClass
  storageClass: ""

# ── Database (MySQL 8) ────────────────────────────────────────────────────────
db:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  port: 3306
  database: wassersport
  username: wassersport
  storage:
    size: 1Gi
    className: "local-path"     # leave empty to use cluster default StorageClass
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  securityContext:
    allowPrivilegeEscalation: false
    # readOnlyRootFilesystem is intentionally NOT set for MySQL:
    # the entrypoint script writes to /etc and /run during init.
    # All other restrictions are in place.
    capabilities:
      drop: ["ALL"]
    runAsGroup: 999
    runAsUser: 999

  # ── Pod-level security ───────────────────────────────────────────────────
  # Note: The official mysql:8 image initialises as root then drops to uid 999.
  # runAsNonRoot cannot be set at pod level; it is enforced per-container below
  # once initialisation is complete.  For a fully non-root DB consider
  # bitnami/mysql or mariadb images as a drop-in replacement.
  podSecurityContext:
    fsGroup: 999      # mysql group owns mounted volumes
    seccompProfile:
      type: RuntimeDefault

# ── Secrets ───────────────────────────────────────────────────────────────────
# IMPORTANT: In production use an external secret manager (Vault, ESO, Sealed Secrets).
# Never commit real values to source control.
secrets:
  dbPassword: "change-me"
  dbRootPassword: "change-me-root"
  jwtSecret: "change-me-in-production-use-32-chars-minimum"
  smtpPass: "change-me-smtp-password"

# ── SMTP (password-reset e-mails) ─────────────────────────────────────────────
smtp:
  host: "smtp.example.com"
  port: "587"
  user: "noreply@example.com"
  from: "Havelkanal Wassersport <noreply@example.com>"
  # password goes in secrets.smtpPass above

# ── Application base URL (used in reset-link e-mails) ─────────────────────────
appBaseUrl: "https://wassersport.example.com"

# ── Log level: trace | debug | info | warn | error | fatal ────────────────────
# Set to debug to enable SMTP connection details and DB pool diagnostics
logLevel: "info"

# ── Seed job (creates demo user demo/demo1234) ────────────────────────────────
seedJob:
  enabled: true

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  host: "wassersport.example.com"
  tls: true
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt"
    # Must be >= the multer limit in routes/admin.js (10 MB). Without this,
    # ingress-nginx enforces its 1 MiB default and rejects image uploads with
    # an HTML 413 page before the request reaches the app.
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"

# ── HPA ───────────────────────────────────────────────────────────────────────
# Must stay disabled while uploads.accessMode is ReadWriteOnce (only one pod
# can mount the upload PVC at a time). Enable only if you switch to RWX.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

# ── Pod Disruption Budget ─────────────────────────────────────────────────────
# With a single app replica a PDB adds no availability guarantee — disable
# to avoid blocking node drains during maintenance.
podDisruptionBudget:
  enabled: false
  minAvailable: 0
