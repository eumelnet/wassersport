<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blog - Havelkanal Wassersport</title>
  <meta name="description" content="Blog von Havelkanal Wassersport." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img class="brand-mark" src="/logo.png" data-i18n-alt="common.logoAlt" alt="Logo von Havelkanal Wassersport" />
      <span class="brand-name" data-i18n="siteName">Havelkanal Wassersport</span>
    </a>
    <nav class="nav">
      <a href="/#activities" data-i18n="nav.activities">Aktivitäten</a>
      <a href="/#about" data-i18n="nav.about">Über uns</a>
      <a href="/#news" data-i18n="nav.news">Neuigkeiten</a>
      <a class="btn book-link" href="/#kalender" data-i18n="nav.calendar">Kalender</a>
      <label class="language-switcher" for="language-select">
        <span data-i18n="language.label">Sprache</span>
        <select id="language-select" data-language-switcher data-i18n-aria-label="language.switcherAria" aria-label="Sprache wechseln">
          <option value="de">DE</option>
          <option value="en">EN</option>
          <option value="pl">PL</option>
          <option value="nl">NL</option>
        </select>
      </label>
      <a class="btn" href="/login.html" data-i18n="nav.login">Anmelden</a>
    </nav>
  </header>

  <main>
    <article class="subpage" id="blog-article">
      <p class="news-empty" data-i18n="blog.loading">Lade Beitrag...</p>
    </article>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> <span data-i18n="siteName">Havelkanal Wassersport</span></div>
    <nav class="foot-nav">
      <a href="/#about" data-i18n="nav.about">Über uns</a>
      <a href="/#activities" data-i18n="nav.activities">Aktivitäten</a>
      <a href="/#news" data-i18n="nav.news">Neuigkeiten</a>
      <a href="/#kalender" data-i18n="nav.calendar">Kalender</a>
    </nav>
  </footer>

  <script src="/i18n.js"></script>
  <script src="/blog-post.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
