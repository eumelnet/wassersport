const SHIFT = CFG.shift, HALF = CFG.half, MAXZ = CFG.maxzoom;
const KM_A = CFG.km_a, KM_B = CFG.km_b;
const km2s = km => (km - KM_B)/KM_A*1000;
const s2km = s  => KM_B + KM_A*(s/1000);

// custom CRS: lat = s (m along axis), lng = t (m across)
const crs = L.Util.extend({}, L.CRS.Simple, {
    projection: L.Projection.LonLat,
    transformation: new L.Transformation(RES0, RES0*HALF, RES0, RES0*SHIFT),
    scale: z => Math.pow(2, z),
    zoom: sc => Math.log(sc)/Math.LN2
});

const map = L.map('map', {crs, minZoom:0, maxZoom:MAXZ, attributionControl:false,
    zoomControl:false, worldCopyJump:false,
    maxBounds:[[S_START,-HALF-20],[S_END, HALF+20]]});
L.control.zoom({position:'bottomright'}).addTo(map);

// white fallback for out-of-range tiles
function whiteURI(){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><rect width="256" height="256" fill="#f7f5ee"/></svg>');}
const Layer = L.GridLayer.extend({
    createTile: function(coords, done){
        const img = document.createElement('img');
        img.onload = () => done(null, img);
        img.onerror = () => done('tile error');
        const cfg = CFG.rows[String(coords.z)];
        if (cfg && coords.x >= 0 && coords.x < cfg.cols &&
            coords.y >= 0 && coords.y < cfg.rows){
            img.src = (CFG.tileBase||'tiles') + `/${coords.z}/${coords.x}/${coords.y}.png`;
        } else {
            img.src = whiteURI();
        }
        return img;
    }
});
new Layer({tileSize:TILE, minZoom:0, maxZoom:MAXZ}).addTo(map);

// ---------- km rail markers along the canal ----------
const kmIcons = L.layerGroup().addTo(map);
function placeKmMarkers(){
    kmIcons.clearLayers();
    for (let km=0; km<=34; km++){
        const s = km2s(km);
        L.marker([s, -(HALF-70)], {interactive:false,
            icon:L.divIcon({html:`<div class="km-marker">km ${km}</div>`,className:'',iconSize:[42,12]})})
            .bindTooltip(`km ${km},00`).addTo(kmIcons);
    }
}
placeKmMarkers();

// ---------- POI list + markers ----------
const TYPES = {Brücke:'#7b3f00', Schleuse:'#003b7a', Wendebucht:'#0059b3', Hafen:'#0e7c4a',
    Liegestelle:'#4e9a51', Ortschaft:'#9c5a2a', Gewässer:'#2a7fc7', Grenze:'#5a5a5a'};
const icons={};
for (const[k,c] of Object.entries(TYPES)){
    icons[k]=L.divIcon({html:`<div style="width:13px;height:13px;border-radius:2px;
        background:${c};border:1.5px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.5)"></div>`,
        className:'',iconSize:[13,13],iconAnchor:[7,7]});
}
const group=L.layerGroup().addTo(map);
const poisEl=document.getElementById('pois');
let grp='';
for (const p of POIS){
    if (p.type!==grp){grp=p.type; const g=document.createElement('div');
        g.className='grp'; g.textContent=grp; poisEl.appendChild(g);}
    const row=document.createElement('div');
    row.className='poi';
    row.innerHTML=`<span style="color:${p.color}">■</span> ${p.name}<span class="km">km ${p.km.toFixed(2)}</span>`;
    row.onclick=()=>{ map.flyTo([p.lat, p.lng], MAXZ, {animate:true}); };
    poisEl.appendChild(row);
    const mk=L.marker([p.lat,p.lng],{icon:icons[p.type]});
    mk.bindPopup(`<b>${p.name}</b><br>${p.type} · km ${p.km.toFixed(2)} · t = ${p.lng.toFixed(0)} m`);
    mk.addTo(group);
}

function goKm(){
    const km=parseFloat(document.getElementById('km').value);
    if (isNaN(km)) return;
    map.flyTo([km2s(km), 0], MAXZ, {animate:true});
}
const statusEl=document.getElementById('status');
map.on('mousemove', e => {
    const km=KM_B+KM_A*(e.latlng.lat/1000);
    const t=e.latlng.lng;
    const side = t < -8 ? 'links' : (t > 8 ? 'rechts' : 'Mitte');
    statusEl.innerHTML = `km ${km.toFixed(2)}  ·  ${side} ${t>=0?'+':''}${t.toFixed(0)} m`;
});

// initial view: center of strip
map.setView([(S_START+S_END)/2, 0], 1);
