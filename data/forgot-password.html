<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Passwort vergessen — Havelkanal Wassersport</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img class="brand-mark" src="logo.png" alt="Canal Watersports logo" />
      <span class="brand-name">Havelkanal Wassersport</span>
    </a>
    <nav class="nav">
      <a href="/#activities">Aktivitäten</a>
      <a href="/#about">Über uns</a>
      <label class="lang-switch" aria-label="Sprache wählen">
        <select data-language-select>
          <option value="de">DE</option>
          <option value="en">EN</option>
        </select>
      </label>
      <a class="btn book-link" href="/#book">Nimm teil</a>
    </nav>
  </header>

  <main>
    <section class="auth-section">
      <div class="auth-box">
        <h1>Passwort vergessen</h1>
        <p class="auth-subtitle">Gib Deine E-Mail-Adresse ein. Falls ein Konto existiert, erhältst Du einen Reset-Link.</p>

        <form class="auth-form" id="forgot-form" novalidate>
          <label>
            E-Mail-Adresse
            <input type="email" name="email" id="email" autocomplete="email" required />
          </label>
          <p class="auth-error"   id="forgot-error"   aria-live="polite"></p>
          <p class="auth-success" id="forgot-success" aria-live="polite"></p>
          <button class="btn primary" type="submit" id="forgot-btn">Reset-Link senden</button>
          <p class="auth-hint"><a href="/login.html">Zurück zur Anmeldung</a></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> Havelkanal Wassersport</div>
    <nav class="foot-nav">
      <a href="/#about">Über uns</a>
      <a href="/#activities">Aktivitäten</a>
      <a href="/#book">Teilnehmen</a>
    </nav>
  </footer>

  <script src="lang.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn     = document.getElementById('forgot-btn');
      const errEl   = document.getElementById('forgot-error');
      const okEl    = document.getElementById('forgot-success');
      const email   = document.getElementById('email').value.trim();

      errEl.textContent = '';
      okEl.textContent  = '';
      btn.disabled = true;
      btn.textContent = 'Einen Moment…';

      try {
        const res  = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (data.ok) {
          okEl.textContent = data.message;
          document.getElementById('forgot-form').reset();
        } else {
          errEl.textContent = data.error || 'Fehler beim Senden.';
        }
      } catch {
        errEl.textContent = 'Netzwerkfehler. Bitte erneut versuchen.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Reset-Link senden';
      }
    });
  </script>
</body>
</html>
