<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="meta.forgotTitle">Passwort vergessen - Havelkanal Wassersport</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img class="brand-mark" src="logo.png" data-i18n-alt="common.logoAlt" alt="Logo von Havelkanal Wassersport" />
      <span class="brand-name" data-i18n="siteName">Havelkanal Wassersport</span>
    </a>
    <nav class="nav">
      <a href="/#activities" data-i18n="nav.activities">Aktivitäten</a>
      <a href="/#about" data-i18n="nav.about">Über uns</a>
      <label class="language-switcher" for="language-select">
        <span data-i18n="language.label">Sprache</span>
        <select id="language-select" data-language-switcher data-i18n-aria-label="language.switcherAria" aria-label="Sprache wechseln">
          <option value="de">DE</option>
          <option value="en">EN</option>
          <option value="pl">PL</option>
          <option value="nl">NL</option>
        </select>
      </label>
      <a class="btn book-link" href="/#kalender" data-i18n="nav.join">Mitmachen</a>
    </nav>
  </header>

  <main>
    <section class="auth-section">
      <div class="auth-box">
        <h1 data-i18n="forgot.heading">Passwort vergessen</h1>
        <p class="auth-subtitle" data-i18n="forgot.subtitle">Gib Deine E-Mail-Adresse ein. Falls ein Konto existiert, erhältst Du einen Reset-Link.</p>

        <form class="auth-form" id="forgot-form" novalidate>
          <label for="email">
            <span data-i18n="forgot.email">E-Mail-Adresse</span>
            <input type="email" name="email" id="email" autocomplete="email" required />
          </label>
          <p class="auth-error"   id="forgot-error"   aria-live="polite"></p>
          <p class="auth-success" id="forgot-success" aria-live="polite"></p>
          <button class="btn primary" type="submit" id="forgot-btn" data-i18n="forgot.submit">Reset-Link senden</button>
          <p class="auth-hint"><a href="/login.html" data-i18n="forgot.back">Zurück zur Anmeldung</a></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> <span data-i18n="siteName">Havelkanal Wassersport</span></div>
    <nav class="foot-nav">
      <a href="/#about" data-i18n="nav.about">Über uns</a>
      <a href="/#activities" data-i18n="nav.activities">Aktivitäten</a>
      <a href="/#kalender" data-i18n="nav.join">Mitmachen</a>
    </nav>
  </footer>

  <script src="i18n.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn     = document.getElementById('forgot-btn');
      const errEl   = document.getElementById('forgot-error');
      const okEl    = document.getElementById('forgot-success');
      const email   = document.getElementById('email').value.trim();

      errEl.textContent = '';
      okEl.textContent  = '';
      btn.disabled = true;
      btn.textContent = window.WassersportI18n.t('forgot.loading');

      try {
        const res  = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (data.ok) {
          okEl.textContent = data.message;
          document.getElementById('forgot-form').reset();
        } else {
          errEl.textContent = data.error || window.WassersportI18n.t('forgot.sendError');
        }
      } catch {
        errEl.textContent = window.WassersportI18n.t('forgot.network');
      } finally {
        btn.disabled = false;
        btn.textContent = window.WassersportI18n.t('forgot.submit');
      }
    });
  </script>
</body>
</html>
