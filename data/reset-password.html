<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neues Passwort — Havelkanal Wassersport</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img class="brand-mark" src="logo.png" alt="Canal Watersports logo" />
      <span class="brand-name">Havelkanal Wassersport</span>
    </a>
    <nav class="nav">
      <a href="/#activities">Aktivitäten</a>
      <a href="/#about">Über uns</a>
      <a class="btn book-link" href="/#book">Nimm teil</a>
    </nav>
  </header>

  <main>
    <section class="auth-section">
      <div class="auth-box" id="reset-box">
        <h1>Neues Passwort</h1>
        <p class="auth-subtitle">Wähle ein neues Passwort (mindestens 8 Zeichen).</p>

        <form class="auth-form" id="reset-form" novalidate>
          <label>
            Neues Passwort
            <input type="password" name="password" id="password"
                   autocomplete="new-password" minlength="8" required />
          </label>
          <label>
            Passwort bestätigen
            <input type="password" name="password2" id="password2"
                   autocomplete="new-password" minlength="8" required />
          </label>
          <p class="auth-error" id="reset-error" aria-live="polite"></p>
          <button class="btn primary" type="submit" id="reset-btn">Passwort speichern</button>
        </form>

        <!-- shown after success instead of the form -->
        <div id="reset-done" style="display:none; text-align:center;">
          <p class="auth-success" style="font-size:16px; margin-bottom:16px;">
            Passwort erfolgreich geändert.
          </p>
          <a class="btn primary" href="/login.html">Zur Anmeldung</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> Havelkanal Wassersport</div>
    <nav class="foot-nav">
      <a href="/#about">Über uns</a>
      <a href="/#activities">Aktivitäten</a>
      <a href="/#book">Teilnehmen</a>
    </nav>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Extract token from URL — abort early if missing
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.getElementById('reset-error').textContent =
        'Ungültiger Link. Bitte fordere einen neuen Reset-Link an.';
      document.getElementById('reset-form').style.display = 'none';
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn      = document.getElementById('reset-btn');
      const errEl    = document.getElementById('reset-error');
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      errEl.textContent = '';

      if (password !== password2) {
        errEl.textContent = 'Passwörter stimmen nicht überein.';
        return;
      }
      if (password.length < 8) {
        errEl.textContent = 'Passwort muss mindestens 8 Zeichen lang sein.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Einen Moment…';

      try {
        const res  = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (data.ok) {
          document.getElementById('reset-form').style.display = 'none';
          document.getElementById('reset-done').style.display = 'block';
        } else {
          errEl.textContent = data.error || 'Fehler beim Speichern.';
          btn.disabled = false;
          btn.textContent = 'Passwort speichern';
        }
      } catch {
        errEl.textContent = 'Netzwerkfehler. Bitte erneut versuchen.';
        btn.disabled = false;
        btn.textContent = 'Passwort speichern';
      }
    });
  </script>
</body>
</html>
