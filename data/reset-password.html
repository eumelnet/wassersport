<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="meta.resetTitle">Neues Passwort - Havelkanal Wassersport</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img class="brand-mark" src="logo.png" data-i18n-alt="common.logoAlt" alt="Logo von Havelkanal Wassersport" />
      <span class="brand-name" data-i18n="siteName">Havelkanal Wassersport</span>
    </a>
    <nav class="nav">
      <a href="/#activities" data-i18n="nav.activities">Aktivitäten</a>
      <a href="/#about" data-i18n="nav.about">Über uns</a>
      <label class="language-switcher" for="language-select">
        <span data-i18n="language.label">Sprache</span>
        <select id="language-select" data-language-switcher data-i18n-aria-label="language.switcherAria" aria-label="Sprache wechseln">
          <option value="de">DE</option>
          <option value="en">EN</option>
          <option value="pl">PL</option>
          <option value="nl">NL</option>
        </select>
      </label>
      <a class="btn book-link" href="/#kalender" data-i18n="nav.join">Mitmachen</a>
    </nav>
  </header>

  <main>
    <section class="auth-section">
      <div class="auth-box" id="reset-box">
        <h1 data-i18n="reset.heading">Neues Passwort</h1>
        <p class="auth-subtitle" data-i18n="reset.subtitle">Wähle ein neues Passwort mit mindestens 8 Zeichen.</p>

        <form class="auth-form" id="reset-form" novalidate>
          <label for="password">
            <span data-i18n="reset.newPassword">Neues Passwort</span>
            <input type="password" name="password" id="password"
                   autocomplete="new-password" minlength="8" required />
          </label>
          <label for="password2">
            <span data-i18n="reset.confirmPassword">Passwort bestätigen</span>
            <input type="password" name="password2" id="password2"
                   autocomplete="new-password" minlength="8" required />
          </label>
          <p class="auth-error" id="reset-error" aria-live="polite"></p>
          <button class="btn primary" type="submit" id="reset-btn" data-i18n="reset.submit">Passwort speichern</button>
        </form>

        <div id="reset-done" style="display:none; text-align:center;">
          <p class="auth-success" style="font-size:16px; margin-bottom:16px;">
            <span data-i18n="reset.success">Passwort erfolgreich geändert.</span>
          </p>
          <a class="btn primary" href="/login.html" data-i18n="reset.back">Zur Anmeldung</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> <span data-i18n="siteName">Havelkanal Wassersport</span></div>
    <nav class="foot-nav">
      <a href="/#about" data-i18n="nav.about">Über uns</a>
      <a href="/#activities" data-i18n="nav.activities">Aktivitäten</a>
      <a href="/#kalender" data-i18n="nav.join">Mitmachen</a>
    </nav>
  </footer>

  <script src="i18n.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.getElementById('reset-error').textContent =
        window.WassersportI18n.t('reset.invalidLink');
      document.getElementById('reset-form').style.display = 'none';
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn      = document.getElementById('reset-btn');
      const errEl    = document.getElementById('reset-error');
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      errEl.textContent = '';

      if (password !== password2) {
        errEl.textContent = window.WassersportI18n.t('reset.mismatch');
        return;
      }
      if (password.length < 8) {
        errEl.textContent = window.WassersportI18n.t('reset.tooShort');
        return;
      }

      btn.disabled = true;
      btn.textContent = window.WassersportI18n.t('reset.loading');

      try {
        const res  = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (data.ok) {
          document.getElementById('reset-form').style.display = 'none';
          document.getElementById('reset-done').style.display = 'block';
        } else {
          errEl.textContent = data.error || window.WassersportI18n.t('reset.saveError');
          btn.disabled = false;
          btn.textContent = window.WassersportI18n.t('reset.submit');
        }
      } catch {
        errEl.textContent = window.WassersportI18n.t('reset.network');
        btn.disabled = false;
        btn.textContent = window.WassersportI18n.t('reset.submit');
      }
    });
  </script>
</body>
</html>
