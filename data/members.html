<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mitglieder — Havelkanal Wassersport</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img class="brand-mark" src="logo.png" alt="Canal Watersports logo" />
      <span class="brand-name">Havelkanal Wassersport</span>
    </a>
    <nav class="nav">
      <a href="/#activities">Aktivitäten</a>
      <a href="/#about">Über uns</a>
      <span class="auth-user" id="nav-user"></span>
      <button class="btn" id="logout-btn" type="button">Abmelden</button>
    </nav>
  </header>

  <main>
    <section class="members-section">
      <header class="section-header">
        <h1>Mitgliederbereich</h1>
        <p id="welcome-msg">Willkommen!</p>
      </header>

      <div class="members-content">
        <div class="about-content">
          <h2>Mitgliederliste</h2>
          <table class="members-table" id="members-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Sport</th>
                <th>Mitglied seit</th>
              </tr>
            </thead>
            <tbody id="members-tbody">
              <tr><td colspan="3">Lade Daten…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> Havelkanal Wassersport</div>
    <nav class="foot-nav">
      <a href="/#about">Über uns</a>
      <a href="/#activities">Aktivitäten</a>
      <a href="/#book">Teilnehmen</a>
    </nav>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    async function init() {
      // Load current user
      const meRes = await fetch('/api/me');
      if (!meRes.ok) {
        window.location.href = '/login.html';
        return;
      }
      const me = await meRes.json();
      document.getElementById('nav-user').textContent = me.username;
      document.getElementById('welcome-msg').textContent =
        'Willkommen, ' + me.username + '!';

      // Load member data
      const dataRes = await fetch('/api/members/data');
      if (dataRes.ok) {
        const { members } = await dataRes.json();
        const tbody = document.getElementById('members-tbody');
        tbody.innerHTML = members.map(m =>
          '<tr><td>' + m.name + '</td><td>' + m.sport + '</td><td>' + m.since + '</td></tr>'
        ).join('');
      }
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });

    init();
  </script>
</body>
</html>
